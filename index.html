    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Paint the dark base before any CSS or JS arrives. */
      html,
      body {
        background: #05060d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The Sorting Ceremony needs JavaScript. Please enable it and reload.</noscript>
    <script>
      /* Very old phone browsers (before Chrome 111 / Safari 16.4) can't draw the styling. Tell people
         what to do instead of showing a broken page. Harmless on every current browser. */
      (function () {
        try {
          var ok =
            window.CSS &&
            CSS.supports &&
            CSS.supports('color', 'color-mix(in srgb, red, blue)') &&
            CSS.supports('translate', '1px');
          if (ok) return;
          var b = document.createElement('div');
          b.setAttribute('role', 'alert');
          b.style.cssText =
            'position:fixed;left:0;right:0;top:0;z-index:99999;padding:12px 44px 12px 14px;' +
            'background:#f3d98c;color:#1a1206;font:600 14px/1.4 system-ui,sans-serif;text-align:center';
          b.textContent =
            'Your browser is out of date, so this page may look broken. Please open this link in the latest Chrome or Safari.';
          var x = document.createElement('button');
          x.textContent = '\u00d7';
          x.setAttribute('aria-label', 'Close');
          x.style.cssText =
            'position:absolute;right:8px;top:6px;border:0;background:none;font-size:26px;line-height:1;color:#1a1206';
          x.onclick = function () { b.remove(); };
          b.appendChild(x);
          document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(b); });
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
